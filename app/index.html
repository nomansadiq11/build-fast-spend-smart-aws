<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Community Day Demo</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0b1f3a, #14274e);
      color: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      max-width: 640px;
      padding: 2.5rem 3rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .date {
      font-size: 1.1rem;
      color: #ff9900;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .description {
      font-size: 1rem;
      line-height: 1.6;
      color: #d7dde5;
      white-space: pre-line;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 153, 0, 0.15);
      color: #ff9900;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AWS Community Day Demo</h1>
    <div class="date">Date: 03-Oct-2026</div>
    <!-- TODO: replace with the real presentation description once shared -->
    <div class="description">
      Hands-on with AWS FinOps &amp; DevOps Agents -- live demo application
      running on Amazon EKS.
    </div>
    <div class="badge">build-fast-spend-smart</div>
  </div>
</body>
</html>
